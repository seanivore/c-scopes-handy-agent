<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gesture Whiteboard</title>
    <style>
        body {
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f0f0f0;
            overflow: hidden;
        }
        
        #container {
            position: relative;
            width: 100vw;
            height: 100vh;
        }
        
        #webcam {
            position: absolute;
            bottom: 20px;
            right: 20px;
            width: 240px;
            height: 180px;
            border: 2px solid #333;
            border-radius: 8px;
            transform: scaleX(-1);
            z-index: 100;
        }
        
        #canvas {
            position: absolute;
            bottom: 20px;
            right: 20px;
            width: 240px;
            height: 180px;
            border-radius: 8px;
            transform: scaleX(-1);
            z-index: 101;
            pointer-events: none;
        }
        
        #whiteboard {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: white;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.1);
        }
        
        .element {
            position: absolute;
            border: 2px solid transparent;
            transition: transform 0.1s ease-out;
            cursor: move;
        }
        
        .element.selected {
            border-color: #007AFF;
            box-shadow: 0 0 0 3px rgba(0, 122, 255, 0.2);
        }
        
        .sticky-note {
            width: 200px;
            height: 200px;
            background: #FFEB3B;
            box-shadow: 2px 2px 5px rgba(0,0,0,0.1);
            padding: 20px;
            font-size: 18px;
            transform-origin: center;
        }
        
        .shape {
            width: 100px;
            height: 100px;
            background: #2196F3;
            border-radius: 50%;
        }
        
        .text-box {
            padding: 10px 20px;
            background: white;
            border: 2px solid #333;
            font-size: 24px;
            min-width: 100px;
        }
        
        #gesture-indicator {
            position: absolute;
            top: 20px;
            left: 20px;
            padding: 10px 20px;
            background: rgba(0, 0, 0, 0.8);
            color: white;
            border-radius: 20px;
            font-size: 16px;
            z-index: 200;
        }
        
        #instructions {
            position: absolute;
            top: 20px;
            right: 20px;
            width: 300px;
            background: rgba(255, 255, 255, 0.9);
            border-radius: 10px;
            padding: 20px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }
        
        #instructions h3 {
            margin-top: 0;
            color: #333;
        }
        
        #instructions ul {
            margin: 0;
            padding-left: 20px;
        }
        
        #instructions li {
            margin: 5px 0;
            color: #666;
        }
        
        .gesture-icon {
            display: inline-block;
            width: 20px;
            text-align: center;
        }
    </style>
</head>
<body>
    <div id="container">
        <div id="whiteboard"></div>
        <video id="webcam" autoplay playsinline></video>
        <canvas id="canvas"></canvas>
        <div id="gesture-indicator">Ready</div>
        
        <div id="instructions">
            <h3>Gesture Controls</h3>
            <ul>
                <li><span class="gesture-icon">👆</span> Tap: Select element</li>
                <li><span class="gesture-icon">👆👆</span> Double tap: Create sticky note</li>
                <li><span class="gesture-icon">✊</span> Fist drag: Move element</li>
                <li><span class="gesture-icon">🤏</span> Pinch: Zoom in/out</li>
                <li><span class="gesture-icon">🔄</span> Two hands: Rotate</li>
                <li><span class="gesture-icon">👉</span> Swipe: Navigate pages</li>
                <li><span class="gesture-icon">🫴</span> Long press: Delete</li>
            </ul>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
    <script src="os_gestures.js"></script>
    <script>
        const videoElement = document.getElementById('webcam');
        const canvasElement = document.getElementById('canvas');
        const canvasCtx = canvasElement.getContext('2d');
        const whiteboardElement = document.getElementById('whiteboard');
        const gestureIndicator = document.getElementById('gesture-indicator');
        
        let elementIdCounter = 0;
        let selectedElement = null;
        let elements = [];
        
        // Create element on whiteboard
        function createElement(type, position) {
            const element = document.createElement('div');
            element.className = `element ${type}`;
            element.id = `element-${elementIdCounter++}`;
            
            // Position in viewport coordinates
            const x = position.x * window.innerWidth;
            const y = position.y * window.innerHeight;
            
            element.style.left = `${x - 100}px`;
            element.style.top = `${y - 100}px`;
            
            if (type === 'sticky-note') {
                element.className += ' sticky-note';
                element.contentEditable = true;
                element.textContent = 'New Note';
            } else if (type === 'shape') {
                element.className += ' shape';
            } else if (type === 'text-box') {
                element.className += ' text-box';
                element.contentEditable = true;
                element.textContent = 'Text';
            }
            
            whiteboardElement.appendChild(element);
            elements.push({
                id: element.id,
                element: element,
                type: type,
                position: { x, y },
                scale: 1,
                rotation: 0
            });
            
            return element;
        }
        
        // Select element at position
        function selectElementAt(position) {
            const x = position.x * window.innerWidth;
            const y = position.y * window.innerHeight;
            
            // Deselect current
            if (selectedElement) {
                selectedElement.element.classList.remove('selected');
            }
            
            // Find element at position
            for (let i = elements.length - 1; i >= 0; i--) {
                const el = elements[i];
                const rect = el.element.getBoundingClientRect();
                
                if (x >= rect.left && x <= rect.right &&
                    y >= rect.top && y <= rect.bottom) {
                    selectedElement = el;
                    el.element.classList.add('selected');
                    return;
                }
            }
            
            selectedElement = null;
        }
        
        // Update element transform
        function updateElementTransform(element) {
            if (!element) return;
            
            const transform = `
                translate(${element.position.x}px, ${element.position.y}px)
                scale(${element.scale})
                rotate(${element.rotation}deg)
            `;
            
            element.element.style.transform = transform;
        }
        
        // Initialize hand tracking
        async function initHandTracking() {
            const hands = new Hands({
                locateFile: (file) => {
                    return `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`;
                }
            });
            
            hands.setOptions({
                maxNumHands: 2,
                modelComplexity: 1,
                minDetectionConfidence: 0.5,
                minTrackingConfidence: 0.5
            });
            
            await hands.initialize();
            
            hands.onResults(onResults);
            
            // Setup camera
            const camera = new Camera(videoElement, {
                onFrame: async () => {
                    await hands.send({image: videoElement});
                },
                width: 1280,
                height: 720
            });
            
            camera.start();
        }
        
        // Process hand tracking results
        function onResults(results) {
            canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);
            
            if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
                // Draw hand landmarks
                for (const landmarks of results.multiHandLandmarks) {
                    drawConnectedLandmarks(landmarks);
                }
                
                // Detect gestures
                const gestures = processGestures(results);
                
                // Handle each gesture
                for (const gesture of gestures) {
                    handleGesture(gesture);
                }
                
                // Update UI
                if (gestures.length > 0) {
                    gestureIndicator.textContent = gestures.map(g => g.type).join(', ');
                    gestureIndicator.style.background = 'rgba(0, 200, 0, 0.8)';
                } else {
                    gestureIndicator.textContent = 'Tracking...';
                    gestureIndicator.style.background = 'rgba(0, 0, 0, 0.8)';
                }
            } else {
                gestureIndicator.textContent = 'No hands';
                gestureIndicator.style.background = 'rgba(200, 0, 0, 0.8)';
                OSGestures.reset();
            }
        }
        
        // Handle detected gestures
        function handleGesture(gesture) {
            switch (gesture.type) {
                case 'tap':
                    if (gesture.count === 1) {
                        selectElementAt(gesture.position);
                    } else if (gesture.count === 2) {
                        const type = Math.random() > 0.5 ? 'sticky-note' : 'shape';
                        createElement(type, gesture.position);
                    }
                    break;
                    
                case 'pan':
                    if (selectedElement) {
                        selectedElement.position.x += gesture.deltaX * window.innerWidth;
                        selectedElement.position.y += gesture.deltaY * window.innerHeight;
                        selectedElement.element.style.left = `${selectedElement.position.x - 100}px`;
                        selectedElement.element.style.top = `${selectedElement.position.y - 100}px`;
                    }
                    break;
                    
                case 'pinch':
                    if (selectedElement) {
                        selectedElement.scale *= gesture.scale;
                        selectedElement.scale = Math.max(0.5, Math.min(3, selectedElement.scale));
                        updateElementTransform(selectedElement);
                    }
                    break;
                    
                case 'rotate':
                    if (selectedElement) {
                        selectedElement.rotation += gesture.degrees;
                        updateElementTransform(selectedElement);
                    }
                    break;
                    
                case 'swipe':
                    // Could implement page navigation here
                    console.log('Swipe:', gesture.direction);
                    break;
                    
                case 'longPress':
                    if (selectedElement) {
                        // Delete element
                        selectedElement.element.remove();
                        elements = elements.filter(el => el.id !== selectedElement.id);
                        selectedElement = null;
                    }
                    break;
            }
        }
        
        // Draw hand landmarks
        function drawConnectedLandmarks(landmarks) {
            const connections = [
                [0, 1], [1, 2], [2, 3], [3, 4],
                [0, 5], [5, 6], [6, 7], [7, 8],
                [0, 9], [9, 10], [10, 11], [11, 12],
                [0, 13], [13, 14], [14, 15], [15, 16],
                [0, 17], [17, 18], [18, 19], [19, 20],
                [5, 9], [9, 13], [13, 17]
            ];
            
            canvasCtx.strokeStyle = '#00FF00';
            canvasCtx.lineWidth = 2;
            
            for (const [i, j] of connections) {
                const start = landmarks[i];
                const end = landmarks[j];
                
                canvasCtx.beginPath();
                canvasCtx.moveTo(start.x * canvasElement.width, start.y * canvasElement.height);
                canvasCtx.lineTo(end.x * canvasElement.width, end.y * canvasElement.height);
                canvasCtx.stroke();
            }
            
            // Draw points
            canvasCtx.fillStyle = '#FF0000';
            for (const landmark of landmarks) {
                canvasCtx.beginPath();
                canvasCtx.arc(
                    landmark.x * canvasElement.width,
                    landmark.y * canvasElement.height,
                    5, 0, 2 * Math.PI
                );
                canvasCtx.fill();
            }
        }
        
        // Initialize
        async function init() {
            try {
                // Setup camera
                const stream = await navigator.mediaDevices.getUserMedia({ video: true });
                videoElement.srcObject = stream;
                
                // Wait for video to load
                videoElement.onloadedmetadata = () => {
                    canvasElement.width = videoElement.videoWidth;
                    canvasElement.height = videoElement.videoHeight;
                    
                    // Start hand tracking
                    initHandTracking();
                };
                
                // Add some initial elements
                setTimeout(() => {
                    createElement('sticky-note', { x: 0.2, y: 0.3 });
                    createElement('shape', { x: 0.5, y: 0.3 });
                    createElement('text-box', { x: 0.8, y: 0.3 });
                }, 1000);
                
            } catch (error) {
                console.error('Error initializing:', error);
                gestureIndicator.textContent = 'Error: ' + error.message;
            }
        }
        
        init();
    </script>
</body>
</html>
