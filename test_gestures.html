<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Natural Gesture Test</title>
    <style>
        body {
            margin: 20px;
            font-family: Arial, sans-serif;
        }

        .status {
            padding: 10px;
            margin: 10px 0;
            border: 2px solid #ccc;
            border-radius: 5px;
        }

        #test-output {
            background-color: #f0f0f0;
            padding: 10px;
            margin: 20px 0;
            border-radius: 5px;
            white-space: pre-wrap;
            font-family: monospace;
        }

        button {
            padding: 10px 20px;
            margin: 5px;
            font-size: 16px;
            cursor: pointer;
        }
    </style>
</head>

<body>
    <h1>Natural Gesture System Test (No Finger Tracking)</h1>

    <div class="status">
        <h3>Status</h3>
        <p>MediaPipe Loaded: <span id="mediapipe-status">Checking...</span></p>
        <p>Camera Ready: <span id="camera-status">Not started</span></p>
        <p>Gesture Tracking: <span id="tracking-status">Disabled</span></p>
    </div>

    <div>
        <button onclick="startNaturalGestures()">Start Natural Gestures</button>
        <button onclick="testGestureFunctions()">Test Functions</button>
    </div>

    <div id="test-output">Test output will appear here...</div>

    <div id="gesture-container" style="position: relative; width: 400px; height: 300px; border: 2px solid #333; margin: 20px 0;">
        <!-- Video and canvas will be placed here -->
    </div>

    <!-- Load MediaPipe and our script -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>

    <script>
        let output = document.getElementById('test-output');

        function log(message) {
            output.textContent += message + '\n';
            console.log(message);
        }

        // Check MediaPipe status
        function checkMediaPipe() {
            if (window.Hands) {
                document.getElementById('mediapipe-status').textContent = 'Loaded ✓';
                log('MediaPipe Hands loaded successfully');
            } else {
                document.getElementById('mediapipe-status').textContent = 'Not loaded ✗';
                log('MediaPipe Hands not available');
            }
        }

        // Mock the game functions
        window.movePiece = function (dx, dy) {
            log(`movePiece called: dx=${dx}, dy=${dy}`);
        };

        window.rotatePiece = function () {
            log('rotatePiece called');
        };

        window.dropPiece = function () {
            log('dropPiece called');
        };

        // Start natural gestures
        function startNaturalGestures() {
            log('Starting natural gestures (no finger tracking)...');
            if (typeof initNaturalHandControls !== 'undefined') {
                initNaturalHandControls();
                document.getElementById('tracking-status').textContent = 'Initializing...';
            } else {
                log('Natural gesture system not loaded');
            }
        }

        // Test gesture functions directly
        function testGestureFunctions() {
            log('Testing gesture functions:');
            movePiece(-1, 0);
            movePiece(1, 0);
            rotatePiece();
            dropPiece();
        }

        // Check status on load
        window.addEventListener('load', () => {
            setTimeout(checkMediaPipe, 1000);
        });
    </script>

    <script src="natural_hand_controls.js"></script>
</body>

</html>
